<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Climate Logger</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 12px; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  input, button { padding: 8px; margin: 4px 4px 4px 0; }
  #latest { font-size: 1.2em; }
</style>
</head>
<body>
<h1>Room Climate Logger</h1>
<div class="card" id="latest">Loading...</div>

<div class="card">
  <h2>Add a reading</h2>
  <input id="temp" type="number" step="0.1" placeholder="Temperature (°C)">
  <input id="hum" type="number" step="0.1" placeholder="Humidity (%)">
  <input id="note" type="text" placeholder="Note (optional)">
  <button id="addBtn">Save reading</button>
</div>

<h2>History</h2>
<div id="list"></div>

<script>
const listEl = document.getElementById('list');
const latestEl = document.getElementById('latest');

async function loadAll() {
  const res = await fetch('/api/readings');
  const readings = await res.json();
  listEl.innerHTML = '';
  if (readings.length === 0) {
    latestEl.textContent = 'No readings yet.';
    return;
  }
  const first = readings[0];
  latestEl.textContent = 'Latest: ' + first.temperature + ' °C, ' + first.humidity + ' % humidity';

  readings.forEach((r) => {
    const card = document.createElement('div');
    card.className = 'card';

    const info = document.createElement('div');
    info.textContent = new Date(r.createdAt).toLocaleString() + ' | ' +
      r.temperature + ' °C | ' + r.humidity + ' % | ' + (r.note || 'no note');

    const editBtn = document.createElement('button');
    editBtn.textContent = 'Edit note';
    editBtn.onclick = async () => {
      const newNote = prompt('New note:', r.note || '');
      if (newNote === null) return;
      await fetch('/api/readings/' + r._id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note: newNote })
      });
      loadAll();
    };

    const delBtn = document.createElement('button');
    delBtn.textContent = 'Delete';
    delBtn.onclick = async () => {
      await fetch('/api/readings/' + r._id, { method: 'DELETE' });
      loadAll();
    };

    card.append(info, editBtn, delBtn);
    listEl.appendChild(card);
  });
}

document.getElementById('addBtn').onclick = async () => {
  const temperature = document.getElementById('temp').value;
  const humidity = document.getElementById('hum').value;
  const note = document.getElementById('note').value;
  if (temperature === '' || humidity === '') {
    alert('Please enter temperature and humidity.');
    return;
  }
  await fetch('/api/readings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ temperature: Number(temperature), humidity: Number(humidity), note })
  });
  document.getElementById('temp').value = '';
  document.getElementById('hum').value = '';
  document.getElementById('note').value = '';
  loadAll();
};

loadAll();
</script>
</body>
</html>
